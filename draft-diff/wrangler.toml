name = "draft-diff"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Pages 配置
pages_build_output_dir = "./public"

# D1 数据库绑定
# 部署前需要：
# 1. npx wrangler d1 create draft-diff-db  (获取 database_id)
# 2. 把获取的 id 替换下面的 YOUR_DATABASE_ID
# 3. npx wrangler d1 execute draft-diff-db --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "draft-diff-db"
database_id = "YOUR_DATABASE_ID"

[vars]
ENVIRONMENT = "production"
